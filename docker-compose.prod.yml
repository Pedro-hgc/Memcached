services:
  web:
    ports:
      - "80:3000"
    deploy:
      placement:
        constraints:
          - node.labels.is-web == true
    secrets:
      - db_password
  db:
    image: lluuiizzz/db-server:latest
    environment:
      POSTGRES_DB: dic_db
      POSTGRES_USER: dev_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

    deploy:
      placement:
        constraints:
          - node.labels.is-db == true
  cache:
    deploy:
      mode: replicated
      replicas: 3
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.is-cache == true

networks:
  swarm_net:
    driver: overlay
    attachable: true

secrets:
  db_password:
    external: true

volumes:
  postgres_data:
