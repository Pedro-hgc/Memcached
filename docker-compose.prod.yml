services:
  web:
    ports:
      - "80:8080"
    deploy:
      placement:
        constraints:
          - node.labels.is-web == true
    secrets:
      - db_password
  db:
    image: lluuiizzz/db-server:latest
    environment:
      POSTGRES_DB: dic_db
      POSTGRES_USER: dev_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    configs:
      - source: db_schema
        target: /docker-entrypoint-initdb.d/01-scheme.sql
      - source: db_populate
        target: /docker-entrypoint-initdb.d/02-populate.sql
      - source: db_data
        target: /docker-entrypoint-initdb.d/data.json
    deploy:
      placement:
        constraints:
          - node.labels.is-db == true
  cache:
    deploy:
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.labels.is-cache == true

networks:
  swarm_net:
    driver: overlay
    attachable: true

configs:
  db_schema:
    file: ./01-scheme.sql
  db_populate:
    file: ./02-populate.sql
  db_data:
    file: ./sample-data.json

secrets:
  db_password:
    external: true

volumes:
  postgres_data:
